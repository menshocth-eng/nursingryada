<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الحضور البيومتري</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* === التصميم الحديث (Light Glass Theme) === */
        :root {
            --primary: #0ea5e9;       /* أزرق سماوي */
            --primary-dark: #0284c7;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #1e293b;
            --bg-dark: #0f172a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
            background-image: url('https://a.top4top.io/p_36115ao3o1.jpg');
            background-size: cover;
            overflow: hidden;
        }

        /* البطاقة الرئيسية */
        .app-card {
            background: var(--glass-bg);
            width: 90%; max-width: 400px;
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.8);
            transition: height 0.3s ease;
        }

        /* === وحدة الكاميرا (The Eye) === */
        .scan-box {
            position: relative;
            width: 260px; height: 260px;
            margin: 20px auto;
            border-radius: 50px; /* Squircle Shape */
            background: #000;
            overflow: hidden;
            border: 4px solid #e2e8f0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 30px -5px rgba(14, 165, 233, 0.2);
            transition: all 0.3s ease;
            transform: translateZ(0);
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* مرآة */
            opacity: 0.9;
        }

        /* تأثير الليزر */
        .laser-beam {
            position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, transparent, rgba(14, 165, 233, 0.6));
            border-bottom: 3px solid var(--primary);
            filter: drop-shadow(0 0 10px var(--primary));
            animation: scanMotion 2s infinite ease-in-out;
            z-index: 5; display: none;
        }

        /* السهم التوجيهي */
        .direction-arrow {
            position: absolute; top: 50%; left: 20px;
            transform: translateY(-50%);
            font-size: 50px; color: var(--warning);
            background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);
            border-radius: 15px; padding: 10px;
            z-index: 10; display: none;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
            animation: arrowMove 0.8s infinite alternate;
        }

        /* حالات الحدود */
        .mode-scan { border-color: var(--primary); box-shadow: 0 0 0 6px rgba(14, 165, 233, 0.15); }
        .mode-wait { border-color: var(--warning); box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.15); }
        .mode-done { border-color: var(--success); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.15); }

        /* العناصر والتفاعلات */
        h2 { margin: 0 0 5px 0; font-weight: 800; color: var(--text-main); }
        p { margin: 0 0 20px 0; color: #64748b; font-size: 13px; font-weight: 600; }

        .modern-input {
            width: 100%; padding: 16px;
            border: 2px solid #e2e8f0; border-radius: 18px;
            font-size: 16px; text-align: center;
            background: #f8fafc; outline: none; transition: 0.3s;
            margin-bottom: 12px; font-weight: 700; color: var(--text-main);
        }
        .modern-input:focus { border-color: var(--primary); background: white; }

        .btn-main {
            width: 100%; padding: 16px; border: none; border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; font-weight: 800; font-size: 16px; cursor: pointer;
            box-shadow: 0 8px 20px -5px rgba(14, 165, 233, 0.4);
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-main:active { transform: scale(0.98); }
        .btn-main:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

        /* حالة الـ GPS */
        .status-pill {
            background: #f1f5f9; color: #64748b;
            padding: 8px 15px; border-radius: 20px;
            font-weight: 700; font-size: 12px;
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 15px; transition: 0.3s;
        }

        /* النوافذ المنبثقة (Modals) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 200; display: none; align-items: center; justify-content: center;
            animation: fadeIn 0.3s;
        }
        .modal-box {
            background: white; width: 85%; max-width: 320px; padding: 30px;
            border-radius: 30px; text-align: center; position: relative;
            transform: scale(0.9); animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .modal-icon-box {
            width: 80px; height: 80px; margin: 0 auto 15px auto; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 35px;
        }
        .type-success .modal-icon-box { background: #d1fae5; color: var(--success); }
        .type-warning .modal-icon-box { background: #fee2e2; color: var(--danger); }
        
        /* التحويل بين الشاشات */
        .section { display: none; opacity: 0; transition: 0.3s; }
        .section.active { display: block; opacity: 1; animation: slideUp 0.5s; }

        /* Animations */
        @keyframes scanMotion { 0% {top: -50%;} 100% {top: 100%;} }
        @keyframes arrowMove { from {transform:translateY(-50%) translateX(0);} to {transform:translateY(-50%) translateX(-15px);} }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
        @keyframes popUp { to {transform: scale(1);} }
        @keyframes slideUp { from {opacity:0; transform:translateY(15px);} to {opacity:1; transform:translateY(0);} }
    </style>
</head>
<body>

    <div id="loaderOverlay" style="position:fixed; inset:0; background:rgba(255,255,255,0.98); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <i class="fa-solid fa-face-viewfinder fa-bounce" style="font-size:50px; color:#0ea5e9; margin-bottom:20px;"></i>
        <h3 style="color:#1e293b;">تهيئة النظام البيومتري...</h3>
    </div>

    <div id="modalSuccess" class="modal-overlay">
        <div class="modal-box type-success">
            <div class="modal-icon-box"><i class="fa-solid fa-check"></i></div>
            <h2 style="color:#10b981; margin:0 0 10px 0;">تم التعرف عليك</h2>
            <p style="color:#64748b; font-weight:600;">تم تسجيل حضورك بنجاح لهذا اليوم.</p>
            <button onclick="location.reload()" class="btn-main" style="margin-top:15px; background:#10b981;">حسناً</button>
        </div>
    </div>

    <div id="modalDuplicate" class="modal-overlay">
        <div class="modal-box type-warning">
            <div class="modal-icon-box"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <h2 style="color:#ef4444; margin:0 0 10px 0;">تنبيه أمني!</h2>
            <p style="color:#1e293b; font-weight:bold;">تم التعرف على الوجه للمرة الثانية</p>
            <p style="color:#ef4444; font-size:12px;">جاري إبلاغ النظام بمحاولة التكرار...</p>
            <button onclick="location.reload()" class="btn-main" style="margin-top:15px; background:#ef4444;">إغلاق</button>
        </div>
    </div>

    <div class="app-card">
        
        <div id="viewInput" class="section active">
            <div style="margin-bottom:20px; width:70px; height:70px; background:#f0f9ff; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;">
                <i class="fa-solid fa-fingerprint" style="font-size:30px; color:#0ea5e9;"></i>
            </div>
            <h2>تسجيل الحضور</h2>
            <p>أدخل بياناتك للمتابعة</p>

            <input type="text" id="inName" class="modern-input" placeholder="الاسم الثلاثي">
            <input type="number" id="inID" class="modern-input" placeholder="الكود الجامعي (ID)">

            <button onclick="checkPermissions()" class="btn-main" id="btnInit">
                بدء الفحص <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div id="gpsStatus" class="status-pill">
                <i class="fa-solid fa-location-crosshairs"></i> في انتظار تفعيل الموقع
            </div>
        </div>

        <div id="viewCamera" class="section">
            <h2 id="camTitle" style="font-size:18px;">التحقق من الوجه</h2>
            <p id="camHint" style="font-size:13px; color:#0ea5e9; font-weight:bold; margin-bottom:15px;">جاري تشغيل الكاميرا...</p>

            <div class="scan-box" id="camBox">
                <video id="videoElement" autoplay muted playsinline></video>
                
                <div class="laser-beam" id="scanLaser"></div>
                <div class="direction-arrow" id="arrowIcon"><i class="fa-solid fa-arrow-left"></i></div>
                
                <div id="camCount" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:80px; font-weight:900; color:white; text-shadow:0 0 20px black; z-index:20; display:none;">3</div>
            </div>

            <div class="status-pill" id="liveStatus" style="color:var(--primary-dark);">
                <i class="fa-solid fa-shield-halved"></i> التحقق من الحيوية
            </div>
        </div>

    </div>

    <audio id="sndBeep" src="https://www.soundjay.com/buttons/sounds/beep-22.mp3"></audio>
    <audio id="sndSuccess" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
    <audio id="sndError" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

    <script>
        // ==========================================
        //  الإعدادات
        // ==========================================
        const CONFIG = {
            // ⚠️ تأكد من تحديث هذا الرابط بآخر رابط Deploy حصلت عليه
            scriptUrl: "https://script.google.com/macros/s/AKfycbxmcOUau-cLWbayj6KNhOGVk_DV774e7GIBj2x61FxGAzJDH0YzSsEgCIqBAJuHNKoc/exec",
            models: 'https://justadudewhohacks.github.io/face-api.js/models'
        };

        let userData = { id: null, name: null, lat: null, lng: null, vector: null };
        let stream = null;
        let lastNoseX = 0;

        // 1. التحميل
        window.onload = async () => {
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.models),
                    faceapi.nets.faceLandmark68Net.loadFromUri(CONFIG.models),
                    faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.models),
                    faceapi.nets.faceExpressionNet.loadFromUri(CONFIG.models)
                ]);
                document.getElementById('loaderOverlay').style.display = 'none';
            } catch (e) { alert("فشل تحميل النظام. تأكد من الإنترنت."); }
        };

        // 2. التحقق من البيانات و GPS
        function checkPermissions() {
            const name = document.getElementById('inName').value;
            const id = document.getElementById('inID').value;
            const btn = document.getElementById('btnInit');
            const gpsTxt = document.getElementById('gpsStatus');

            if (name.length < 3 || id.length < 3) return alert("يرجى ملء البيانات بشكل صحيح");

            userData.name = name;
            userData.id = id;
            btn.disabled = true;
            btn.innerHTML = 'جاري تحديد الموقع... <i class="fa-solid fa-spinner fa-spin"></i>';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userData.lat = pos.coords.latitude;
                    userData.lng = pos.coords.longitude;
                    gpsTxt.innerHTML = '<i class="fa-solid fa-check-circle"></i> تم تحديد الموقع بنجاح';
                    gpsTxt.style.color = "var(--success)";
                    startCamera();
                }, () => {
                    btn.disabled = false;
                    btn.innerHTML = 'إعادة المحاولة';
                    alert("يجب تفعيل الموقع (GPS) للمتابعة!");
                }, {enableHighAccuracy: true});
            } else { alert("جهازك لا يدعم GPS"); }
        }

        // 3. الكاميرا والذكاء الاصطناعي
        async function startCamera() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('viewCamera').classList.add('active');

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('videoElement').srcObject = stream;
                startLogic();
            } catch(e) { alert("الكاميرا محظورة! يرجى السماح بالوصول."); location.reload(); }
        }

        function startLogic() {
            const video = document.getElementById('videoElement');
            const laser = document.getElementById('scanLaser');
            const arrow = document.getElementById('arrowIcon');
            const border = document.getElementById('camBox');
            const hint = document.getElementById('camHint');
            const pill = document.getElementById('liveStatus');
            const counter = document.getElementById('camCount');

            let step = 0; // 0=Stable, 1=Twist
            let frames = 0;
            let timer = null;

            const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 });

            setInterval(async () => {
                if(video.paused || video.ended) return;

                const det = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor().withFaceExpressions();

                if(det) {
                    const nose = det.landmarks.getNose()[0];
                    const jaw = det.landmarks.getJawOutline();
                    const ratio = Math.abs(nose.x - jaw[0].x) / Math.abs(nose.x - jaw[16].x);
                    const diff = Math.abs(nose.x - lastNoseX);
                    lastNoseX = nose.x;
                    const isStable = diff < 5 && det.expressions.neutral > 0.7;

                    // 1. الثبات (Stability Check)
                    if(step === 0) {
                        if(ratio > 0.7 && ratio < 1.3 && isStable) {
                            frames++;
                            border.className = "scan-box mode-scan";
                            laser.style.display = 'block';
                            hint.innerText = "ممتاز.. خليك ثابت";
                            hint.style.color = "var(--primary)";
                            
                            if(frames > 5) {
                                document.getElementById('sndBeep').play();
                                step = 1;
                                frames = 0;
                                let c = 3;
                                counter.style.display = 'flex';
                                laser.style.display = 'none';
                                
                                timer = setInterval(() => {
                                    counter.innerText = c;
                                    c--;
                                    if(c < 0) {
                                        clearInterval(timer);
                                        counter.style.display = 'none';
                                        userData.vector = Array.from(det.descriptor);
                                        
                                        // الانتقال للالتفات
                                        step = 2;
                                        border.className = "scan-box mode-wait";
                                        arrow.style.display = 'block'; // السهم يظهر يساراً
                                        hint.innerHTML = 'التفت باتجاه السهم <i class="fa-solid fa-arrow-left"></i>';
                                        hint.style.color = "var(--warning)";
                                        pill.innerHTML = "اختبار الحيوية";
                                        pill.style.color = "var(--warning)";
                                    }
                                }, 800);
                            }
                        } else {
                            frames = 0;
                            border.className = "scan-box";
                            laser.style.display = 'none';
                            hint.innerText = "انظر للكاميرا مباشرة";
                            hint.style.color = "#64748b";
                        }
                    }

                    // 2. الالتفات (Liveness Check)
                    else if(step === 2) {
                        if(ratio < 0.6) { // يسار
                            border.className = "scan-box mode-done";
                            arrow.style.display = 'none';
                            hint.innerText = "تم التحقق!";
                            hint.style.color = "var(--success)";
                            step = 3; 
                            sendData();
                        }
                    }
                }
            }, 200);
        }

        // 4. الإرسال (مع كشف التكرار)
        function sendData() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('liveStatus').innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> جاري الإرسال...';

            const payload = {
                id: userData.id,
                name: userData.name,
                lat: userData.lat,
                lng: userData.lng,
                vector: JSON.stringify(userData.vector)
            };

            // نستخدم fetch عادي لأننا نريد قراءة الرد (JSON)
            // هام: تأكد أنك قمت بعمل Deployment جديد للسكريبت ليسمح بـ CORS أو استخدم no-cors كخيار أخير
            fetch(CONFIG.scriptUrl, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'duplicate' || data.status === 'error') {
                    // نافذة التكرار
                    document.getElementById('sndError').play();
                    document.getElementById('modalDuplicate').style.display = 'flex';
                } else {
                    // نافذة النجاح
                    document.getElementById('sndSuccess').play();
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    document.getElementById('modalSuccess').style.display = 'flex';
                }
            })
            .catch(e => {
                // في حالة وجود خطأ (أو CORS block)، نفترض النجاح المبدئي أو نعرض خطأ
                console.error(e);
                alert("تم الإرسال، ولكن تعذر قراءة رد السيرفر. تحقق من السجلات.");
                location.reload();
            });
        }
    </script>
</body>
</html>
