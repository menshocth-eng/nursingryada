<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فحص الوجه والموقع</title>
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #0f172a; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* تصميم الكاميرا */
        .cam-box { 
            width: 260px; 
            height: 260px; 
            background: #000; 
            border-radius: 50%; 
            margin: 20px auto; 
            overflow: hidden; 
            border: 5px solid #e2e8f0; 
            position: relative; 
            transition: border-color 0.3s;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* العداد */
        .timer { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            display:flex; align-items:center; justify-content:center; 
            font-size:80px; font-weight:900; color:white; 
            text-shadow: 0 0 10px black; z-index: 10; display: none; 
        }

        /* حالات الكاميرا */
        .status-ok { border-color: #10b981; box-shadow: 0 0 20px #10b981; }
        .status-wait { border-color: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
        .status-err { border-color: #ef4444; box-shadow: 0 0 20px #ef4444; }

        /* المدخلات */
        input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            border: 2px solid #ccc; border-radius: 10px; 
            text-align: center; font-size: 16px; font-family: 'Cairo';
        }
        button { 
            width: 100%; padding: 15px; 
            background: #0ea5e9; color: white; 
            border: none; border-radius: 10px; 
            font-size: 18px; font-weight: bold; cursor: pointer; 
        }
        
        /* شاشة التحميل */
        #loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 99; display: flex; 
            align-items: center; justify-content: center; 
            flex-direction: column; color: #0ea5e9; 
        }
    </style>
</head>
<body>

    <div id="loader">
        <h2>جاري تحميل النظام...</h2>
    </div>

    <div class="container">
        <h2>تسجيل الحضور (وجه + موقع)</h2>
        
        <div id="inputForm">
            <input type="text" id="name" placeholder="الاسم الثلاثي">
            <input type="number" id="uid" placeholder="الكود الجامعي (ID)">
            <button onclick="initSystem()">ابدأ الفحص 📸</button>
        </div>

        <div id="camArea" style="display:none;">
            <div class="cam-box" id="camBorder">
                <video id="video" autoplay muted playsinline></video>
                <div id="timerDisplay" class="timer">3</div>
            </div>
            <h3 id="statusText" style="color:#0ea5e9">جاري التشغيل...</h3>
            <p style="font-size:12px; color:#666;">ممنوع الحركة أو الضحك</p>
        </div>
    </div>

    <script>
        // 🔴🔴 ضع رابط السكريبت الخاص بك هنا 🔴🔴
        const API_URL = "https://script.google.com/macros/s/AKfycbxRuqCAmOENY4Iy4O4mDpjXUGfRB9i9QjvuS_fRlzV1S-KA-lWHX3AoTUGHI7NjkgKA/exec"; 

        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        const video = document.getElementById('video');
        let userLat = "", userLng = "";
        let bestDescriptor = null;
        let lastNoseX=0, lastNoseY=0;

        // 1. تحميل الموديلات
        window.onload = async () => {
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                    faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
                ]);
                document.getElementById('loader').style.display = 'none';
            } catch(e) { alert("فشل تحميل الملفات"); }
        };

        // 2. التحقق من البيانات وطلب الموقع
        function initSystem() {
            if(!document.getElementById('name').value || !document.getElementById('uid').value) {
                return alert("أدخل البيانات أولاً");
            }

            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    startCamera();
                }, () => {
                    alert("⚠️ يجب تفعيل GPS لحساب النقطة المرجعية!");
                    startCamera(); 
                }, {enableHighAccuracy: true});
            } else {
                startCamera();
            }
        }

        // 3. فتح الكاميرا
        async function startCamera() {
            document.getElementById('inputForm').style.display = 'none';
            document.getElementById('camArea').style.display = 'block';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                document.getElementById('statusText').innerText = "اثبت مكانك تماماً";
                startLogic();
            } catch(e) { alert("الكاميرا محظورة"); location.reload(); }
        }

        // 4. المنطق الصارم (وجه + ثبات + تعابير)
        function startLogic() {
            let step = 0; // 0=Timer, 1=Left
            let count = 3;
            let counting = false;
            let timerInterval = null;

            const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 });

            setInterval(async () => {
                const det = await faceapi.detectSingleFace(video, options)
                                         .withFaceLandmarks()
                                         .withFaceDescriptor()
                                         .withFaceExpressions();
                
                if(det) {
                    const nose = det.landmarks.getNose()[0];
                    const jaw = det.landmarks.getJawOutline();
                    const ratio = Math.abs(nose.x - jaw[0].x) / Math.abs(nose.x - jaw[16].x);
                    
                    // شروط الأمان
                    const expr = det.expressions;
                    const isStableFace = expr.neutral > 0.8 || (expr.happy < 0.1 && expr.surprised < 0.1);
                    
                    const moveDist = Math.sqrt(Math.pow(nose.x - lastNoseX, 2) + Math.pow(nose.y - lastNoseY, 2));
                    lastNoseX = nose.x; lastNoseY = nose.y;
                    const isNotMoving = moveDist < 5; 

                    // المرحلة 1: التثبيت
                    if(step === 0) {
                        if(ratio > 0.8 && ratio < 1.2 && isStableFace && isNotMoving) {
                            document.getElementById('camBorder').className = "cam-box status-ok";
                            document.getElementById('statusText').innerText = "ممتاز.. خليك ثابت";
                            document.getElementById('statusText').style.color = "#10b981";

                            if(!counting) {
                                counting = true;
                                document.getElementById('timerDisplay').style.display = "flex";
                                timerInterval = setInterval(() => {
                                    count--;
                                    document.getElementById('timerDisplay').innerText = count;
                                    if(count <= 0) {
                                        clearInterval(timerInterval);
                                        bestDescriptor = Array.from(det.descriptor); // حفظ البصمة
                                        document.getElementById('timerDisplay').style.display = "none";
                                        step = 1;
                                        document.getElementById('camBorder').className = "cam-box status-wait";
                                        document.getElementById('statusText').innerText = "⬅️ التفت لليسار";
                                        document.getElementById('statusText').style.color = "#f59e0b";
                                    }
                                }, 1000);
                            }
                        } else {
                            if(counting) {
                                clearInterval(timerInterval); counting = false; count = 3;
                                document.getElementById('timerDisplay').innerText = "3";
                                document.getElementById('timerDisplay').style.display = "none";
                            }
                            document.getElementById('camBorder').className = "cam-box status-err";
                            
                            if(!isNotMoving) document.getElementById('statusText').innerText = "⚠️ لا تتحرك!";
                            else if(!isStableFace) document.getElementById('statusText').innerText = "😐 بدون تعابير!";
                            else document.getElementById('statusText').innerText = "👀 انظر للأمام";
                            
                            document.getElementById('statusText').style.color = "#ef4444";
                        }
                    }
                    
                    // المرحلة 2: الالتفات (يسار)
                    else if(step === 1) {
                        if(ratio < 0.5) {
                            document.getElementById('camBorder').className = "cam-box status-ok";
                            document.getElementById('statusText').innerText = "✅ جاري الإرسال...";
                            document.getElementById('statusText').style.color = "#10b981";
                            // إيقاف اللوب والإرسال
                            video.srcObject.getTracks().forEach(track => track.stop());
                            sendData();
                        }
                    }
                }
            }, 500);
        }

        // 5. إرسال البيانات للسيرفر
        function sendData() {
            const payload = {
                id: document.getElementById('uid').value,
                name: document.getElementById('name').value,
                vector: bestDescriptor,
                lat: userLat, lng: userLng
            };

            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(r => r.json())
            .then(data => {
                if(data.status === 'success') {
                    alert("✅ " + data.message);
                } else {
                    alert("❌ " + data.message);
                }
                location.reload();
            })
            .catch(e => {
                alert("خطأ في الاتصال");
                location.reload();
            });
        }
    </script>
</body>
</html>
