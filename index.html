<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Metric Security System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #00f2ff;
            --accent: #2196f3;
            --bg-deep: #050505;
            --glass: rgba(20, 30, 40, 0.7);
            --success: #00ff88;
            --warning: #ffcc00;
            --danger: #ff0055;
        }

        body {
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            font-family: 'Cairo', sans-serif;
            background: var(--bg-deep);
            color: white;
            display: flex; align-items: center; justify-content: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(33, 150, 243, 0.1) 0%, transparent 20%);
        }

        /* الكارت الرئيسي (Holographic Card) */
        .cyber-panel {
            width: 90%; max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px 20px;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.05);
            text-align: center;
            position: relative;
            transform-style: preserve-3d;
            animation: floatCard 6s ease-in-out infinite;
        }

        /* نافذة الكاميرا (The Eye) */
        .scan-window {
            position: relative;
            width: 260px; height: 260px;
            margin: 20px auto;
            border-radius: 50%; /* دائري */
            background: #000;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 0 5px rgba(0,0,0,0.5), 0 0 30px rgba(0, 242, 255, 0.2);
            transition: all 0.4s ease;
        }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.8; }

        /* تأثيرات الليزر */
        .scanner-beam {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary), 0 0 10px white;
            animation: scanUpDown 2s infinite ease-in-out;
            z-index: 10; display: none;
        }

        /* السهم التوجيهي */
        .guide-arrow {
            position: absolute; top: 50%; left: 15px; 
            transform: translateY(-50%);
            font-size: 50px; color: var(--warning);
            z-index: 20; display: none;
            filter: drop-shadow(0 0 10px var(--warning));
            animation: pointLeft 0.8s infinite alternate;
        }

        /* دائرة الحالة */
        .status-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 4px solid transparent;
            transition: 0.3s; pointer-events: none; z-index: 5;
        }
        .st-scan { border-color: var(--primary); border-top-color: transparent; animation: spin 2s infinite linear; }
        .st-wait { border-color: var(--warning); box-shadow: inset 0 0 30px rgba(255, 204, 0, 0.3); }
        .st-ok { border-color: var(--success); box-shadow: 0 0 30px var(--success); }

        /* النصوص والمدخلات */
        h2 { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; margin: 0; letter-spacing: 2px; }
        .input-cyber {
            width: 100%; padding: 15px; margin-bottom: 15px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: white; text-align: center; font-size: 16px;
            outline: none; transition: 0.3s;
        }
        .input-cyber:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        .btn-cyber {
            width: 100%; padding: 15px; background: linear-gradient(90deg, var(--primary), #0088ff);
            color: #000; font-weight: 800; border: none; border-radius: 12px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s; font-family: 'Rajdhani'; font-size: 18px;
        }
        .btn-cyber:active { transform: scale(0.98); }
        .btn-cyber:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* شاشات */
        .section { display: none; opacity: 0; transform: scale(0.95); transition: 0.4s; }
        .section.active { display: block; opacity: 1; transform: scale(1); }

        /* Loader */
        #bootLoader { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        /* نافذة التنبيه */
        .popup-modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 500;
            display: none; align-items: center; justify-content: center;
        }
        .popup-content {
            background: #111; border: 1px solid #333; padding: 30px;
            border-radius: 20px; text-align: center; max-width: 300px;
            box-shadow: 0 0 50px rgba(255,0,0,0.2);
        }

        @keyframes scanUpDown { 0%,100% {top:0} 50% {top:100%} }
        @keyframes spin { to {transform: rotate(360deg);} }
        @keyframes floatCard { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-10px);} }
        @keyframes pointLeft { from {transform:translateY(-50%) translateX(0);} to {transform:translateY(-50%) translateX(-15px);} }
    </style>
</head>
<body>

    <div id="bootLoader">
        <i class="fa-solid fa-microchip fa-spin" style="font-size: 50px; color: var(--primary); margin-bottom: 20px;"></i>
        <div style="font-family: 'Rajdhani'; color: var(--primary); letter-spacing: 3px;">SYSTEM INITIALIZING...</div>
    </div>

    <div id="alertPopup" class="popup-modal">
        <div class="popup-content">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 50px; color: var(--danger); margin-bottom: 15px;"></i>
            <h3 style="color: white; margin:0;">تنبيه أمني</h3>
            <p id="alertText" style="color: #aaa; font-size: 13px;">تم كشف محاولة تكرار.</p>
            <button onclick="location.reload()" class="btn-cyber" style="background: var(--danger); color: white;">إغلاق</button>
        </div>
    </div>

    <div class="cyber-panel">
        
        <div id="viewInput" class="section active">
            <div style="margin-bottom: 20px;">
                <i class="fa-solid fa-user-shield" style="font-size: 40px; color: var(--primary);"></i>
            </div>
            <h2>تأكيد الهوية</h2>
            <p style="color: #888; font-size: 12px; margin-bottom: 25px;">يرجى إدخال البيانات لتفعيل البصمة المكانية</p>

            <input type="text" id="uName" class="input-cyber" placeholder="الاسم الكامل">
            <input type="number" id="uID" class="input-cyber" placeholder="الرقم التعريفي (ID)">

            <button onclick="initSystem()" id="btnStart" class="btn-cyber">
                START SCAN <i class="fa-solid fa-power-off"></i>
            </button>
            <div id="gpsTxt" style="margin-top:15px; font-size:10px; color:#555;">GPS SIGNAL: SEARCHING...</div>
        </div>

        <div id="viewScan" class="section">
            <h2 id="scanTitle" style="color:var(--primary);">التحقق البيومتري</h2>
            <p id="scanHint" style="color:#aaa; font-size:12px;">جاري تشغيل المستشعرات...</p>

            <div class="scan-window">
                <video id="webcam" autoplay muted playsinline></video>
                <div class="scanner-beam" id="beam"></div>
                <div class="guide-arrow" id="arrow"><i class="fa-solid fa-arrow-left"></i></div>
                <div class="status-ring" id="ring"></div>
                
                <div id="counter" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:80px; font-weight:900; color:white; text-shadow:0 0 20px var(--primary); z-index:30; display:none;">3</div>
            </div>

            <div style="font-family:'Rajdhani'; color:var(--primary); font-size:14px; margin-top:10px;">
                <i class="fa-solid fa-location-crosshairs"></i> <span id="locData">-- , --</span>
            </div>
        </div>

        <div id="viewSuccess" class="section">
            <div style="width:80px; height:80px; border-radius:50%; border:2px solid var(--success); display:flex; align-items:center; justify-content:center; margin:0 auto 20px auto; box-shadow:0 0 30px var(--success);">
                <i class="fa-solid fa-check" style="font-size:40px; color:var(--success);"></i>
            </div>
            <h2 style="color:var(--success);">ACCESS GRANTED</h2>
            <p style="color:white;">تم تسجيل الحضور وتحليل الموقع بنجاح.</p>
            
            <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; margin-bottom:20px;">
                <div style="font-size:11px; color:#aaa;">LOCATION STATUS</div>
                <div id="finalStatus" style="font-weight:bold; color:var(--primary);">Analyzing...</div>
            </div>

            <button onclick="location.reload()" class="btn-cyber" style="background:#222; color:#fff;">تسجيل جديد</button>
        </div>

    </div>

    <audio id="sndScan" src="https://www.soundjay.com/buttons/sounds/beep-22.mp3"></audio>
    <audio id="sndDone" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
    <audio id="sndErr" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

    <script>
        // === الإعدادات ===
        const CONFIG = {
            // الرابط الذي أنشأته
            apiUrl: "https://script.google.com/macros/s/AKfycbxjrxV8Y47W0kyf1FxrctuqUEcf3wQUuXJo9n1J77RncmaMn2vc8v0jCSyPAEHwLhey/exec",
            models: 'https://justadudewhohacks.github.io/face-api.js/models'
        };

        let userInfo = { id: null, name: null, lat: null, lng: null, vector: null };
        let stream = null;
        let lastNoseX = 0;

        // 1. تشغيل النظام
        window.onload = async () => {
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.models),
                    faceapi.nets.faceLandmark68Net.loadFromUri(CONFIG.models),
                    faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.models),
                    faceapi.nets.faceExpressionNet.loadFromUri(CONFIG.models)
                ]);
                document.getElementById('bootLoader').style.display = 'none';
            } catch (e) { alert("فشل تحميل النظام"); }
        };

        // 2. التحقق والموقع
        function initSystem() {
            const name = document.getElementById('uName').value;
            const id = document.getElementById('uID').value;
            const btn = document.getElementById('btnStart');
            const gps = document.getElementById('gpsTxt');

            if(name.length < 3 || id.length < 3) return alert("البيانات غير مكتملة");

            userInfo.name = name;
            userInfo.id = id;
            btn.disabled = true;
            btn.innerText = "CONNECTING GPS...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userInfo.lat = pos.coords.latitude;
                    userInfo.lng = pos.coords.longitude;
                    gps.innerText = "GPS LOCKED ✅";
                    gps.style.color = "var(--success)";
                    document.getElementById('locData').innerText = `${userInfo.lat.toFixed(4)} , ${userInfo.lng.toFixed(4)}`;
                    startCam();
                }, () => {
                    btn.disabled = false;
                    btn.innerText = "RETRY";
                    alert("الموقع مطلوب!");
                }, {enableHighAccuracy: true});
            } else { alert("لا يوجد GPS"); }
        }

        // 3. الكاميرا والذكاء الاصطناعي
        async function startCam() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('viewScan').classList.add('active');

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('webcam').srcObject = stream;
                runBrain();
            } catch(e) { alert("الكاميرا محظورة"); location.reload(); }
        }

        function runBrain() {
            const video = document.getElementById('webcam');
            const beam = document.getElementById('beam');
            const arrow = document.getElementById('arrow');
            const ring = document.getElementById('ring');
            const hint = document.getElementById('scanHint');
            const countEl = document.getElementById('counter');

            let step = 0; // 0=Stable, 1=Twist
            let frames = 0;
            let timer = null;

            const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 });

            const loop = setInterval(async () => {
                if(video.paused || video.ended) return;

                const det = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor().withFaceExpressions();

                if(det) {
                    const nose = det.landmarks.getNose()[0];
                    const jaw = det.landmarks.getJawOutline();
                    const ratio = Math.abs(nose.x - jaw[0].x) / Math.abs(nose.x - jaw[16].x);
                    const diff = Math.abs(nose.x - lastNoseX);
                    lastNoseX = nose.x;
                    
                    const isStable = diff < 5 && det.expressions.neutral > 0.7;

                    // --- المرحلة 1: الثبات ---
                    if(step === 0) {
                        if(ratio > 0.7 && ratio < 1.3 && isStable) {
                            frames++;
                            ring.className = "status-ring st-scan";
                            beam.style.display = "block";
                            hint.innerText = "جاري مسح الملامح... " + (frames*10) + "%";
                            hint.style.color = "var(--primary)";

                            if(frames > 10) {
                                document.getElementById('sndScan').play();
                                step = 1; 
                                frames = 0;
                                beam.style.display = "none";
                                
                                // بدء العد
                                let c = 3;
                                countEl.style.display = "flex";
                                timer = setInterval(() => {
                                    countEl.innerText = c;
                                    c--;
                                    if(c < 0) {
                                        clearInterval(timer);
                                        countEl.style.display = "none";
                                        userInfo.vector = Array.from(det.descriptor);
                                        
                                        // الانتقال للالتفات
                                        step = 2;
                                        ring.className = "status-ring st-wait";
                                        arrow.style.display = "block"; // ⬅️
                                        hint.innerHTML = "التفت باتجاه السهم";
                                        hint.style.color = "var(--warning)";
                                    }
                                }, 800);
                            }
                        } else {
                            frames = 0;
                            ring.className = "status-ring";
                            beam.style.display = "none";
                            hint.innerText = "اثبت أمام الكاميرا";
                            hint.style.color = "#aaa";
                        }
                    }

                    // --- المرحلة 2: الالتفات ---
                    else if(step === 2) {
                        if(ratio < 0.6) { // Left Turn
                            clearInterval(loop);
                            arrow.style.display = "none";
                            ring.className = "status-ring st-ok";
                            hint.innerText = "تم التحقق!";
                            hint.style.color = "var(--success)";
                            document.getElementById('sndDone').play();
                            upload();
                        }
                    }
                }
            }, 100);
        }

        // 4. الإرسال والرد
        function upload() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('scanTitle').innerText = "جاري الاتصال بالسيرفر...";

            const payload = {
                id: userInfo.id,
                name: userInfo.name,
                lat: userInfo.lat,
                lng: userInfo.lng,
                vector: JSON.stringify(userInfo.vector)
            };

            fetch(CONFIG.apiUrl, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'duplicate' || data.status === 'error') {
                    // نافذة خطأ/تكرار
                    document.getElementById('alertText').innerText = data.message;
                    document.getElementById('alertPopup').style.display = 'flex';
                    document.getElementById('sndErr').play();
                } else {
                    // نجاح
                    document.getElementById('finalStatus').innerText = data.message.includes('بعيد') ? "⚠️ تحذير: بعيد عن التجمع" : "✅ موقع سليم";
                    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                    document.getElementById('viewSuccess').classList.add('active');
                    confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
                }
            })
            .catch(e => {
                // التعامل مع CORS لو السكريبت لم يرجع JSON
                // نفترض النجاح كحل أخير
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById('viewSuccess').classList.add('active');
            });
        }
    </script>
</body>
</html>
