<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماسح الحضور البيومتري</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        body { 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background: #0f172a; font-family: 'Cairo', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* حاوية الكاميرا الكاملة */
        .scanner-container {
            position: relative;
            width: 100%; max-width: 500px;
            height: 100%; max-height: 800px;
            background: #000;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* مرآة */
        }

        /* طبقة التوجيهات (فوق الفيديو) */
        .overlay-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 40px 20px;
        }

        /* إطار التركيز */
        .focus-frame {
            width: 280px; height: 280px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); /* تعتيم الخلفية */
        }

        /* حالات الإطار */
        .frame-idle { border-color: #e2e8f0; }
        .frame-wait { border-color: #f59e0b; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5), 0 0 30px #f59e0b; }
        .frame-success { border-color: #10b981; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5), 0 0 50px #10b981; }

        /* النصوص */
        .status-text {
            color: white; font-size: 22px; font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 20px;
            margin-top: 50px;
        }

        .gps-badge {
            color: rgba(255,255,255,0.7); font-size: 12px; font-family: 'Outfit';
            background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 10px;
        }

        /* زر البدء (يظهر مرة واحدة) */
        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-start {
            background: #0ea5e9; color: white; padding: 15px 40px;
            border: none; border-radius: 50px; font-size: 20px; font-weight: bold;
            cursor: pointer; margin-top: 20px;
        }

        /* أيقونة النجاح الكبيرة */
        .success-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 100px; color: #10b981;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }
        .show-success { transform: translate(-50%, -50%) scale(1); }

    </style>
</head>
<body>

    <div id="startOverlay">
        <i class="fa-solid fa-face-viewfinder" style="font-size: 60px; color: #0ea5e9;"></i>
        <h2 style="color: white; margin-top: 20px;">نظام الحضور البيومتري</h2>
        <p style="color: #94a3b8;">مطلوب تفعيل الكاميرا والموقع</p>
        <button class="btn-start" onclick="initSystem()">بدء النظام</button>
        <div id="loadingText" style="color:#64748b; margin-top:10px; display:none;">جاري تحميل الموديلات...</div>
    </div>

    <div class="scanner-container">
        <video id="video" autoplay muted playsinline></video>
        
        <div class="overlay-ui">
            <div class="gps-badge" id="gpsStatus"><i class="fa-solid fa-location-dot"></i> جاري التحديد...</div>
            <div class="focus-frame frame-idle" id="scanFrame"></div>
            <div class="status-text" id="statusTxt">جاري التشغيل...</div>
        </div>

        <i class="fa-solid fa-circle-check success-icon" id="successIcon"></i>
    </div>

    <audio id="sndBeep" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
    <audio id="sndSuccess" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

    <script>
        // === الإعدادات ===
        const CONFIG = {
            sheetUrl: "https://script.google.com/macros/s/AKfycbxWGW1SIR7XzlX9oJ6GBKcSSURPez19cJgXNHU3mNP7sRwJneP_KJsBGsIqdhn8hEpt/exec",
            modelsUrl: 'https://justadudewhohacks.github.io/face-api.js/models'
        };

        let currentLat = null;
        let currentLng = null;
        let isProcessing = false; // لمنع التكرار أثناء المعالجة
        let lastNoseX = 0;

        // === 1. تشغيل النظام ===
        async function initSystem() {
            const startBtn = document.querySelector('.btn-start');
            const loadTxt = document.getElementById('loadingText');
            
            startBtn.style.display = 'none';
            loadTxt.style.display = 'block';

            // 1. طلب الموقع
            if(navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLng = pos.coords.longitude;
                        document.getElementById('gpsStatus').innerHTML = `<i class="fa-solid fa-satellite-dish"></i> ${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
                        document.getElementById('gpsStatus').style.color = "#10b981";
                    },
                    (err) => {
                        document.getElementById('gpsStatus').innerHTML = "❌ الموقع غير مفعل";
                        document.getElementById('gpsStatus').style.color = "#ef4444";
                    },
                    { enableHighAccuracy: true }
                );
            }

            // 2. تحميل الموديلات والكاميرا
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.modelsUrl),
                    faceapi.nets.faceLandmark68Net.loadFromUri(CONFIG.modelsUrl),
                    faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.modelsUrl),
                    faceapi.nets.faceExpressionNet.loadFromUri(CONFIG.modelsUrl)
                ]);
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('video').srcObject = stream;
                
                document.getElementById('startOverlay').style.display = 'none';
                startScanningLoop();

            } catch (e) {
                alert("حدث خطأ في التحميل: " + e);
                location.reload();
            }
        }

        // === 2. حلقة الفحص المستمر ===
        function startScanningLoop() {
            const videoEl = document.getElementById('video');
            const frame = document.getElementById('scanFrame');
            const txt = document.getElementById('statusTxt');
            
            let step = 0; // 0=ثبات، 1=حركة
            let stableCounter = 0;

            setInterval(async () => {
                if(isProcessing) return; // لو بنرفع بيانات، نوقف الفحص لحظياً

                const det = await faceapi.detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions({ inputSize: 160 }))
                                          .withFaceLandmarks()
                                          .withFaceDescriptor()
                                          .withFaceExpressions();

                if (det) {
                    const nose = det.landmarks.getNose()[0];
                    const jaw = det.landmarks.getJawOutline();
                    const ratio = Math.abs(nose.x - jaw[0].x) / Math.abs(nose.x - jaw[16].x);
                    
                    // حساب الثبات
                    const moveDiff = Math.abs(nose.x - lastNoseX);
                    lastNoseX = nose.x;
                    const isStable = moveDiff < 5;

                    // == المرحلة 1: الثبات ==
                    if (step === 0) {
                        if (ratio > 0.8 && ratio < 1.2 && isStable) {
                            stableCounter++;
                            frame.className = "focus-frame frame-wait";
                            txt.innerText = "جاري التحقق... " + Math.min(stableCounter, 3);
                            
                            if (stableCounter > 3) { // بعد 3 فريمات ثبات
                                document.getElementById('sndBeep').play();
                                step = 1;
                                txt.innerText = "⬅️ التفت لليسار";
                                txt.style.color = "#f59e0b";
                            }
                        } else {
                            stableCounter = 0;
                            frame.className = "focus-frame frame-idle";
                            txt.innerText = "اثبت أمام الكاميرا";
                            txt.style.color = "white";
                        }
                    } 
                    // == المرحلة 2: الالتفات (Liveness) ==
                    else if (step === 1) {
                        if (ratio < 0.6) { // التف لليسار
                            handleSuccess(det.descriptor);
                            step = 0; stableCounter = 0; // إعادة ضبط
                        }
                    }

                } else {
                    // لا يوجد وجه
                    frame.className = "focus-frame frame-idle";
                    txt.innerText = "جاري البحث عن وجه...";
                    step = 0; stableCounter = 0;
                }
            }, 300);
        }

        // === 3. التعامل مع النجاح والإرسال ===
        function handleSuccess(descriptor) {
            isProcessing = true; // إيقاف الفحص مؤقتاً
            
            // تأثيرات بصرية
            document.getElementById('scanFrame').className = "focus-frame frame-success";
            document.getElementById('successIcon').classList.add('show-success');
            document.getElementById('statusTxt').innerText = "تم التسجيل بنجاح!";
            document.getElementById('statusTxt').style.color = "#10b981";
            document.getElementById('sndSuccess').play();

            // إرسال البيانات (في الخلفية)
            sendData(descriptor);

            // إعادة النظام للعمل بعد 3 ثواني
            setTimeout(() => {
                document.getElementById('successIcon').classList.remove('show-success');
                document.getElementById('scanFrame').className = "focus-frame frame-idle";
                document.getElementById('statusTxt').innerText = "جاهز للطالب التالي...";
                document.getElementById('statusTxt').style.color = "white";
                isProcessing = false; // استئناف الفحص
            }, 3000);
        }

        function sendData(vector) {
            if(!currentLat) return; // لا نرسل بدون موقع

            const payload = {
                action: "register",
                // بما إننا لغينا صفحة الإدخال، بنبعت كلمة AutoScan
                // السيرفر المفروض يقارن الـ Vector عشان يعرف مين ده
                id: "AUTO_SCAN", 
                name: "Unknown", 
                lat: currentLat,
                lng: currentLng,
                vector: Array.from(vector)
            };

            fetch(CONFIG.sheetUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(e => console.log("Sent via background"));
        }
    </script>
</body>
</html>
