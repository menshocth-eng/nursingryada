<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الحضور الأمني</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* === التصميم === */
        :root { --primary: #0ea5e9; --glass: rgba(255, 255, 255, 0.95); --bg: #0f172a; }
        body { font-family: 'Cairo'; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-image: url('https://a.top4top.io/p_36115ao3o1.jpg'); background-size: cover; overflow: hidden; }
        .app-card { background: var(--glass); width: 90%; max-width: 400px; border-radius: 30px; padding: 30px 20px; text-align: center; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .scan-box { width: 260px; height: 260px; margin: 20px auto; border-radius: 50px; background: #000; overflow: hidden; border: 4px solid #e2e8f0; position: relative; transform: translateZ(0); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .laser-beam { position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to bottom, transparent, #0ea5e9); border-bottom: 3px solid #0ea5e9; animation: scan 2s infinite; display: none; }
        .arrow-guide { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); font-size: 40px; color: #f59e0b; display: none; animation: pointLeft 0.8s infinite alternate; z-index: 10; filter: drop-shadow(0 0 5px orange); }
        .modern-input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 15px; margin-bottom: 10px; text-align: center; font-size: 16px; outline: none; }
        .btn-main { width: 100%; padding: 15px; background: #0ea5e9; color: white; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; }
        .btn-main:disabled { background: #94a3b8; }
        .section { display: none; } .section.active { display: block; animation: fade 0.5s; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: center; justify-content: center; }
        .m-box { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 85%; max-width: 320px; animation: popUp 0.3s; }
        @keyframes scan { 0% {top:-50%} 100% {top:100%} } @keyframes pointLeft { from {transform:translateY(-50%) translateX(0);} to {transform:translateY(-50%) translateX(-10px);} } @keyframes fade { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} } @keyframes popUp { from {transform:scale(0.8);} to {transform:scale(1);} }
    </style>
</head>
<body>

    <div id="loader" style="position:fixed; inset:0; background:rgba(255,255,255,0.98); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <i class="fa-solid fa-server fa-spin" style="font-size:40px; color:#0ea5e9; margin-bottom:20px;"></i>
        <h3>جاري الاتصال بقاعدة البيانات...</h3>
    </div>

    <div id="resultModal" class="modal">
        <div class="m-box">
            <div id="resIcon" style="font-size:50px; margin-bottom:15px;"></div>
            <h2 id="resTitle" style="margin:0 0 10px 0;"></h2>
            <p id="resMsg" style="color:#666; font-size:14px; margin-bottom:20px;"></p>
            <button onclick="location.reload()" class="btn-main">إنهاء</button>
        </div>
    </div>

    <div class="app-card">
        <div id="secInput" class="section active">
            <h2 style="color:#0ea5e9">تسجيل الحضور</h2>
            <p>أدخل بياناتك بدقة</p>
            <input type="text" id="uName" class="modern-input" placeholder="الاسم الثلاثي">
            <input type="number" id="uID" class="modern-input" placeholder="الكود الجامعي">
            <button onclick="initSystem()" id="btnStart" class="btn-main">بدء الفحص</button>
            <div id="gpsStat" style="font-size:12px; margin-top:15px; color:#94a3b8;">GPS مطلوب</div>
        </div>

        <div id="secCam" class="section">
            <h3 id="camStatus" style="color:#1e293b;">التحقق من الوجه</h3>
            <div class="scan-box" id="camBox">
                <video id="vid" autoplay muted playsinline></video>
                <div class="laser-beam" id="laser"></div>
                <div class="arrow-guide" id="arrow"><i class="fa-solid fa-arrow-left"></i></div>
                <div id="counter" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:80px; font-weight:900; color:white; text-shadow:0 0 20px black; display:none;">3</div>
            </div>
            <p id="camHint" style="color:#0ea5e9; font-weight:bold; margin-top:15px;">جاري تشغيل الكاميرا...</p>
        </div>
    </div>

    <audio id="beep" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
    <audio id="err" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

    <script>
        const CONFIG = {
            // 🔴 هام: الرابط الجديد هنا
            apiUrl: "https://script.google.com/macros/s/AKfycbxz7nReucbLeyrdR--mYdufl7thU2MPLj0niGeRXBrFsfTd_SpYlIOROyA5AC0WJjG9/exec",
            models: 'https://justadudewhohacks.github.io/face-api.js/models'
        };

        let user = { id: null, name: null, lat: null, lng: null, vector: null };
        let stream = null;
        let lastNoseX = 0;
        let isSubmitting = false;

        window.onload = async () => {
            try {
                await faceapi.nets.ssdMobilenetv1.loadFromUri(CONFIG.models);
                await faceapi.nets.faceLandmark68Net.loadFromUri(CONFIG.models);
                await faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.models);
                await faceapi.nets.faceExpressionNet.loadFromUri(CONFIG.models);
                document.getElementById('loader').style.display = 'none';
            } catch(e) { alert("فشل تحميل الموديلات"); }
        };

        function initSystem() {
            const name = document.getElementById('uName').value;
            const id = document.getElementById('uID').value;
            if(name.length < 3 || id.length < 3) return alert("أكمل البيانات");
            
            user.name = name; user.id = id;
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStart').innerText = "جاري تحديد الموقع...";

            if(navigator.geolocation) {
                // نأخذ 3 قراءات للموقع لضمان الدقة وتجنب القفزات
                let readings = [];
                let watchId = navigator.geolocation.watchPosition(pos => {
                    if(pos.coords.accuracy < 50) { // تجاهل الدقة الضعيفة
                        readings.push(pos);
                        if(readings.length >= 3) {
                            navigator.geolocation.clearWatch(watchId);
                            // حساب المتوسط
                            user.lat = readings.reduce((a,b)=>a+b.coords.latitude,0)/readings.length;
                            user.lng = readings.reduce((a,b)=>a+b.coords.longitude,0)/readings.length;
                            
                            document.getElementById('gpsStat').innerText = "تم تحديد الموقع";
                            document.getElementById('gpsStat').style.color = "#10b981";
                            startCam();
                        }
                    }
                }, () => { alert("الموقع مطلوب!"); location.reload(); }, {enableHighAccuracy: true});
            } else { alert("GPS غير مدعوم"); }
        }

        async function startCam() {
            document.getElementById('secInput').classList.remove('active');
            document.getElementById('secCam').classList.add('active');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('vid').srcObject = stream;
                runAI();
            } catch(e) { alert("الكاميرا مطلوبة"); location.reload(); }
        }

        function runAI() {
            const video = document.getElementById('vid');
            const box = document.getElementById('camBox');
            const hint = document.getElementById('camHint');
            const laser = document.getElementById('laser');
            const arrow = document.getElementById('arrow');
            const countEl = document.getElementById('counter');
            
            let step = 0; // 0=Stable, 1=Left
            let stableFrames = 0;
            const opts = new faceapi.SsdMobilenetv1Options({ minConfidence: 0.6 });

            const loop = setInterval(async () => {
                if(isSubmitting) { clearInterval(loop); return; }

                const det = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor().withFaceExpressions();

                if(det) {
                    const nose = det.landmarks.getNose()[0];
                    const jaw = det.landmarks.getJawOutline();
                    const ratio = Math.abs(nose.x - jaw[0].x) / Math.abs(nose.x - jaw[16].x);
                    const diff = Math.abs(nose.x - lastNoseX);
                    lastNoseX = nose.x;
                    const isStable = diff < 5 && det.expressions.neutral > 0.6;

                    if(step === 0) {
                        if(ratio > 0.7 && ratio < 1.3 && isStable) {
                            stableFrames++;
                            box.style.borderColor = "#0ea5e9";
                            laser.style.display = 'block';
                            hint.innerText = "جاري المسح... " + (stableFrames*10) + "%";
                            
                            if(stableFrames > 8) {
                                document.getElementById('beep').play();
                                step = 1; stableFrames = 0; laser.style.display = 'none';
                                let c = 3;
                                countEl.style.display = 'flex';
                                let t = setInterval(() => {
                                    countEl.innerText = c; c--;
                                    if(c < 0) {
                                        clearInterval(t); countEl.style.display = 'none';
                                        user.vector = Array.from(det.descriptor);
                                        step = 2;
                                        box.style.borderColor = "#f59e0b";
                                        arrow.style.display = 'block';
                                        hint.innerHTML = 'التفت باتجاه السهم <i class="fa-solid fa-arrow-left"></i>';
                                        hint.style.color = "#f59e0b";
                                    }
                                }, 800);
                            }
                        } else {
                            stableFrames = 0; box.style.borderColor = "#e2e8f0"; laser.style.display = 'none';
                            hint.innerText = "انظر للكاميرا مباشرة"; hint.style.color = "#94a3b8";
                        }
                    } else if(step === 2) {
                        if(ratio < 0.6) { // Left
                            clearInterval(loop);
                            arrow.style.display = 'none';
                            box.style.borderColor = "#10b981";
                            hint.innerText = "تم التحقق!";
                            hint.style.color = "#10b981";
                            uploadData();
                        }
                    }
                }
            }, 200);
        }

        function uploadData() {
            if(isSubmitting) return;
            isSubmitting = true;
            document.getElementById('camStatus').innerText = "جاري الاتصال بالسيرفر...";
            
            const payload = {
                id: user.id,
                name: user.name,
                lat: user.lat,
                lng: user.lng,
                vector: JSON.stringify(user.vector)
            };

            fetch(CONFIG.apiUrl, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
                const modal = document.getElementById('resultModal');
                const icon = document.getElementById('resIcon');
                const title = document.getElementById('resTitle');
                modal.style.display = 'flex';
                
                if(data.status === 'success') {
                    icon.innerHTML = '<i class="fa-solid fa-check-circle" style="color:#10b981;"></i>';
                    title.innerText = "تم التسجيل";
                    title.style.color = "#10b981";
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                } else if(data.status === 'duplicate') {
                    document.getElementById('err').play();
                    icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i>';
                    title.innerText = "تنبيه أمني!";
                    title.style.color = "#ef4444";
                }
                document.getElementById('resMsg').innerText = data.message;
            })
            .catch(e => {
                alert("تم الإرسال."); location.reload();
            });
        }
    </script>
</body>
</html>
