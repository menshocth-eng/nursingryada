<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الحضور الدقيق</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* نفس الستايل الممتاز السابق */
        :root { --primary: #0ea5e9; --glass: rgba(255, 255, 255, 0.95); --bg: #0f172a; }
        body { font-family: 'Cairo'; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-image: url('https://a.top4top.io/p_36115ao3o1.jpg'); background-size: cover; overflow: hidden; }
        .app-card { background: var(--glass); width: 90%; max-width: 400px; border-radius: 30px; padding: 30px 20px; text-align: center; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .scan-box { width: 260px; height: 260px; margin: 20px auto; border-radius: 50px; background: #000; overflow: hidden; border: 4px solid #e2e8f0; position: relative; transform: translateZ(0); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .status-pill { background: #f1f5f9; color: #1e293b; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 12px; margin-top: 10px; display: inline-block; }
        .modern-input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 15px; margin-bottom: 10px; text-align: center; font-size: 16px; outline: none; }
        .btn-main { width: 100%; padding: 15px; background: #0ea5e9; color: white; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(14, 165, 233, 0.3); }
        
        .section { display: none; } .section.active { display: block; animation: fade 0.5s; }
        @keyframes fade { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }

        /* نوافذ */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; }
        .m-box { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 85%; max-width: 320px; }
    </style>
</head>
<body>

    <div id="loader" style="position:fixed; inset:0; background:rgba(255,255,255,0.98); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <i class="fa-solid fa-brain fa-bounce" style="font-size:50px; color:#0ea5e9; margin-bottom:20px;"></i>
        <h3>جاري تحميل النموذج الدقيق...</h3>
        <p style="font-size:12px; color:#666;">(قد يستغرق وقتاً أطول قليلاً للدقة)</p>
    </div>

    <div id="resModal" class="modal">
        <div class="m-box">
            <div id="iconRes" style="font-size:50px; margin-bottom:15px;"></div>
            <h2 id="titleRes" style="margin:0;"></h2>
            <p id="textRes" style="color:#666; font-size:13px;"></p>
            <button onclick="location.reload()" class="btn-main" style="margin-top:15px;">حسناً</button>
        </div>
    </div>

    <div class="app-card">
        <div id="secInput" class="section active">
            <h2 style="color:#0ea5e9">نظام الحضور الدقيق</h2>
            <p>سجل بياناتك</p>
            <input type="text" id="uName" class="modern-input" placeholder="الاسم">
            <input type="number" id="uID" class="modern-input" placeholder="الـ ID">
            <button onclick="startGPS()" id="btnStart" class="btn-main">التالي</button>
            <div id="gpsLog" style="font-size:11px; margin-top:10px; color:#999;">GPS REQUIRED</div>
        </div>

        <div id="secCam" class="section">
            <h3 id="camStat">جاري تحليل الوجه...</h3>
            <div class="scan-box" id="camBox">
                <video id="vid" autoplay muted playsinline></video>
                <div id="focusBox" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:180px; height:240px; border:2px dashed rgba(255,255,255,0.5); border-radius:30px;"></div>
            </div>
            <p id="camHint" style="color:#0ea5e9; font-weight:bold;">انظر للكاميرا</p>
        </div>
    </div>

    <audio id="beep" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

    <script>
        const CONFIG = {
            // 🔴 هام: ضع رابط السكريبت الخاص بك هنا
            apiUrl: "https://script.google.com/macros/s/AKfycbyXnPh5e6iTSY2GygRKX8hytTtyhFrMqV_ZpyqmO19IgP3dIzN169iP2s_fIaF23TVU/exec",
            // نستخدم الموديلات الثقيلة للدقة
            models: 'https://justadudewhohacks.github.io/face-api.js/models'
        };

        let user = { id: null, name: null, lat: null, lng: null, vector: null };
        let isSubmitting = false;

        window.onload = async () => {
            try {
                // تحميل الموديل الثقيل SSD Mobilenet بدلاً من Tiny
                await faceapi.nets.ssdMobilenetv1.loadFromUri(CONFIG.models);
                await faceapi.nets.faceLandmark68Net.loadFromUri(CONFIG.models);
                await faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.models);
                
                document.getElementById('loader').style.display = 'none';
            } catch(e) { alert("خطأ تحميل الموديلات"); }
        };

        // --- 1. GPS Averaging (لحل مشكلة اختلاف المكان) ---
        function startGPS() {
            const name = document.getElementById('uName').value;
            const id = document.getElementById('uID').value;
            if(name.length < 3 || id.length < 3) return alert("البيانات!");

            user.name = name; user.id = id;
            const btn = document.getElementById('btnStart');
            const log = document.getElementById('gpsLog');
            
            btn.disabled = true;
            btn.innerText = "جاري معايرة الموقع (ثبت مكانك)...";

            if(!navigator.geolocation) return alert("لا يوجد GPS");

            let readingsLat = [];
            let readingsLng = [];
            let count = 0;

            // نأخذ 5 قراءات ونحسب المتوسط
            const watchId = navigator.geolocation.watchPosition(pos => {
                // تجاهل الدقة الضعيفة (أكبر من 50 متر)
                if(pos.coords.accuracy > 50) return;

                readingsLat.push(pos.coords.latitude);
                readingsLng.push(pos.coords.longitude);
                count++;
                
                log.innerText = `جاري المعايرة... ${count}/5`;

                if(count >= 5) {
                    navigator.geolocation.clearWatch(watchId);
                    
                    // حساب المتوسط
                    user.lat = readingsLat.reduce((a,b)=>a+b)/count;
                    user.lng = readingsLng.reduce((a,b)=>a+b)/count;
                    
                    log.innerText = "✅ تم تحديد الموقع بدقة";
                    log.style.color = "green";
                    startCam();
                }
            }, err => {
                alert("يجب تفعيل الموقع!");
                btn.disabled = false;
            }, { enableHighAccuracy: true, maximumAge: 0 });
        }

        // --- 2. Camera & Accurate Face Check ---
        async function startCam() {
            document.getElementById('secInput').classList.remove('active');
            document.getElementById('secCam').classList.add('active');
            
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            document.getElementById('vid').srcObject = stream;
            
            runPreciseAI();
        }

        function runPreciseAI() {
            const video = document.getElementById('vid');
            const hint = document.getElementById('camHint');
            const box = document.getElementById('camBox');
            
            // خيارات الموديل الثقيل (أبطأ لكن أدق 10 مرات)
            const options = new faceapi.SsdMobilenetv1Options({ minConfidence: 0.6 });

            let stableFrames = 0;

            const loop = setInterval(async () => {
                if(isSubmitting) { clearInterval(loop); return; }

                const det = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();

                if(det) {
                    // التحقق من أن الوجه ينظر للكاميرا مباشرة
                    // نستخدم حجم الوجه وأبعاده للتاكد
                    const landmarks = det.landmarks;
                    const nose = landmarks.getNose()[0];
                    const leftEye = landmarks.getLeftEye()[0];
                    const rightEye = landmarks.getRightEye()[3];
                    
                    // حساب التماثل (Symmetry) لمعرفة النظر للأمام
                    const dLeft = Math.abs(nose.x - leftEye.x);
                    const dRight = Math.abs(nose.x - rightEye.x);
                    
                    // إذا كان الفرق بين الجهتين أقل من 10 بكسل، فهو ينظر للأمام
                    const isLookingForward = Math.abs(dLeft - dRight) < 10; 

                    if(isLookingForward) {
                        stableFrames++;
                        box.style.borderColor = "#0ea5e9";
                        hint.innerText = "ممتاز.. جارِ المسح " + (stableFrames*20) + "%";
                        
                        if(stableFrames > 5) { // تأكيد لمدة ثانية
                            document.getElementById('beep').play();
                            user.vector = Array.from(det.descriptor);
                            clearInterval(loop);
                            uploadData();
                        }
                    } else {
                        stableFrames = 0;
                        hint.innerText = "عدل وجهك ليكون في المنتصف تماماً";
                        box.style.borderColor = "#f59e0b";
                    }
                } else {
                    stableFrames = 0;
                    hint.innerText = "لم يتم العثور على وجه";
                    box.style.borderColor = "#ef4444";
                }
            }, 200);
        }

        function uploadData() {
            if(isSubmitting) return; 
            isSubmitting = true;
            document.getElementById('camStat').innerText = "جاري الإرسال...";
            
            const payload = {
                id: user.id,
                name: user.name,
                lat: user.lat,
                lng: user.lng,
                vector: JSON.stringify(user.vector)
            };

            fetch(CONFIG.apiUrl, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                const modal = document.getElementById('resModal');
                modal.style.display = 'flex';
                
                if(data.status === 'success') {
                    document.getElementById('iconRes').innerHTML = '✅';
                    document.getElementById('titleRes').innerText = "تم بنجاح";
                    confetti();
                } else if(data.status === 'duplicate') {
                    document.getElementById('iconRes').innerHTML = '🚫';
                    document.getElementById('titleRes').innerText = "محاولة مكررة";
                }
                document.getElementById('textRes').innerText = data.message;
            })
            .catch(e => {
                alert("تم الإرسال.");
                location.reload();
            });
        }
    </script>
</body>
</html>
