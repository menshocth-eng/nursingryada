<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام البصمة الحيوية المتقدم</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* === تصميم المستقبل (Cyberpunk / Glass) === */
        :root {
            --primary: #00f2ff; /* Cyan Neon */
            --secondary: #7000ff; /* Purple Neon */
            --success: #00ff9d;
            --warning: #ffbf00;
            --error: #ff0055;
            --bg-deep: #050505;
            --glass: rgba(20, 20, 30, 0.7);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0; height: 100vh;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; color: white;
        }

        /* حاوية النظام الزجاجية */
        .cyber-card {
            width: 95%; max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
            position: relative; overflow: hidden;
            text-align: center;
            animation: cardFloat 6s ease-in-out infinite alternate;
        }

        /* === نافذة الكاميرا السحرية === */
        .cam-wrapper {
            position: relative;
            width: 260px; height: 260px;
            margin: 20px auto;
            border-radius: 50px; /* Squircle Shape */
            background: #000;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.3), 0 0 30px rgba(0, 242, 255, 0.2);
            transform: translateZ(0); /* تسريع الهاردوير */
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* مرآة */
        }

        /* الليزر الماسح */
        .scanner-beam {
            position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
            animation: scanAnim 2s infinite ease-in-out;
            z-index: 10; display: none;
        }

        /* السهم التوجيهي الكبير (الإضافة الجديدة) */
        .direction-arrow {
            position: absolute; top: 50%; left: 20px; /* يظهر على اليسار */
            transform: translateY(-50%);
            font-size: 60px; color: var(--warning);
            z-index: 20; display: none;
            filter: drop-shadow(0 0 10px rgba(255, 191, 0, 0.8));
            animation: pointLeft 1s infinite alternate;
        }

        /* الحدود التفاعلية */
        .status-border {
            position: absolute; top:0; left:0; width:100%; height:100%;
            border: 6px solid transparent; border-radius: 50px;
            transition: all 0.3s; pointer-events: none; z-index: 5;
        }
        
        .st-scan { border-color: var(--primary); box-shadow: inset 0 0 20px var(--primary); }
        .st-wait { border-color: var(--warning); box-shadow: inset 0 0 30px var(--warning); }
        .st-ok   { border-color: var(--success); box-shadow: inset 0 0 40px var(--success); }

        /* النصوص والأزرار */
        h1 { margin: 0; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; font-size: 20px; background: linear-gradient(90deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .cyber-input {
            width: 100%; padding: 15px; margin-bottom: 15px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: white; text-align: center; font-size: 18px;
            font-family: 'Cairo'; outline: none; transition: 0.3s;
        }
        .cyber-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        .cyber-btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white; font-weight: 900; font-size: 16px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(112, 0, 255, 0.4);
            position: relative; overflow: hidden; transition: 0.3s;
        }
        .cyber-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }
        .cyber-btn:hover::before { left: 100%; }
        .cyber-btn:disabled { background: #333; cursor: not-allowed; box-shadow: none; }

        /* شاشات */
        .section { display: none; opacity: 0; transform: translateY(10px); transition: all 0.5s ease; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }

        /* اللودر */
        #systemLoader {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Animations */
        @keyframes scanAnim { 0% {top:0} 50% {top:100%} 100% {top:0} }
        @keyframes pointLeft { from {transform:translateY(-50%) translateX(0);} to {transform:translateY(-50%) translateX(-10px);} }
        @keyframes cardFloat { from {transform: translateY(0);} to {transform: translateY(-10px);} }
    </style>
</head>
<body>

    <div id="systemLoader">
        <i class="fa-solid fa-dna fa-spin" style="font-size: 60px; color: var(--primary); margin-bottom: 20px;"></i>
        <h2 style="font-family: 'Orbitron'; letter-spacing: 3px; color: white;">SYSTEM LOADING</h2>
        <p style="color: var(--primary); font-size: 12px;">LOADING NEURAL NETWORKS...</p>
    </div>

    <div class="cyber-card">
        
        <div id="screenInput" class="section active">
            <div style="margin-bottom: 20px;">
                <i class="fa-solid fa-user-astronaut" style="font-size: 50px; color: var(--primary);"></i>
            </div>
            <h1>تسجيل الهوية الرقمية</h1>
            <p style="color: #aaa; margin-bottom: 30px;">نظام الحضور الذكي - كلية التمريض</p>

            <input type="text" id="inName" class="cyber-input" placeholder="الاسم الثلاثي">
            <input type="number" id="inID" class="cyber-input" placeholder="الكود الجامعي (ID)">

            <button onclick="startSequence()" class="cyber-btn" id="btnInit">
                تشغيل النظام <i class="fa-solid fa-power-off"></i>
            </button>
            
            <div id="gpsMsg" style="margin-top: 15px; font-size: 11px; color: #555;">GPS SIGNAL REQUIRED</div>
        </div>

        <div id="screenCam" class="section">
            <h1 id="camStatus">جاري تهيئة الكاميرا...</h1>
            
            <div class="cam-wrapper">
                <video id="videoElement" autoplay muted playsinline></video>
                <div class="scanner-beam" id="scanLaser"></div>
                <div class="status-border" id="camBorder"></div>
                
                <i class="fa-solid fa-arrow-left direction-arrow" id="arrowLeft"></i>
                
                <div id="camCounter" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:80px; font-weight:900; color:white; text-shadow:0 0 20px var(--primary); z-index:15; display:none;">3</div>
            </div>

            <p id="camInstruction" style="color: var(--primary); font-weight: bold; font-size: 14px;">يرجى الانتظار...</p>
            
            <div style="display:flex; justify-content: center; gap: 10px;">
                <span style="font-size:10px; color:#555;" id="debugGPS">GPS: --</span>
            </div>
        </div>

        <div id="screenSuccess" class="section">
            <div style="width: 80px; height: 80px; background: rgba(0, 255, 157, 0.1); border-radius: 50%; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; border: 2px solid var(--success);">
                <i class="fa-solid fa-check" style="font-size: 40px; color: var(--success);"></i>
            </div>
            <h1 style="color: var(--success) !important;">تم التوثيق</h1>
            <p style="color: white;">تم تسجيل حضورك بنجاح اليوم.</p>
            
            <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 20px; text-align: right;">
                <div style="font-size: 12px; color: #aaa;">الاسم: <span style="color:white; font-weight:bold;" id="resName">--</span></div>
                <div style="font-size: 12px; color: #aaa;">التوقيت: <span style="color:white; font-weight:bold;" id="resTime">--</span></div>
            </div>

            <button onclick="location.reload()" class="cyber-btn" style="background: #222; border: 1px solid #444;">
                خروج
            </button>
        </div>

    </div>

    <audio id="sBeep" src="https://www.soundjay.com/buttons/sounds/beep-22.mp3"></audio>
    <audio id="sSuccess" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
    <audio id="sScan" src="https://www.soundjay.com/mechanical/sounds/mechanical-clonk-1.mp3"></audio>

    <script>
        // ==========================================
        //  إعدادات النظام
        // ==========================================
        const CONFIG = {
            sheetUrl: "https://script.google.com/macros/s/AKfycbyXnPh5e6iTSY2GygRKX8hytTtyhFrMqV_ZpyqmO19IgP3dIzN169iP2s_fIaF23TVU/exec",
            models: 'https://justadudewhohacks.github.io/face-api.js/models'
        };

        let userData = { id: null, name: null, lat: null, lng: null, vector: null };
        let lastNoseX = 0;
        let stream = null;

        // 1. تشغيل النظام وتحميل الموديلات
        window.onload = async () => {
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.models),
                    faceapi.nets.faceLandmark68Net.loadFromUri(CONFIG.models),
                    faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.models),
                    faceapi.nets.faceExpressionNet.loadFromUri(CONFIG.models)
                ]);
                document.getElementById('systemLoader').style.display = 'none';
            } catch (e) {
                alert("فشل تحميل النظام. تأكد من اتصال الإنترنت.");
            }
        };

        // 2. التحقق من المدخلات والموقع
        function startSequence() {
            const name = document.getElementById('inName').value.trim();
            const id = document.getElementById('inID').value.trim();
            const btn = document.getElementById('btnInit');
            const msg = document.getElementById('gpsMsg');

            if(name.length < 3 || id.length < 3) return alert("يرجى ملء البيانات بشكل صحيح");

            userData.name = name;
            userData.id = id;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-satellite fa-spin"></i> جاري الاتصال بالقمر الصناعي...';

            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userData.lat = pos.coords.latitude;
                        userData.lng = pos.coords.longitude;
                        msg.innerText = "GPS LOCKED ✅";
                        msg.style.color = "var(--success)";
                        document.getElementById('debugGPS').innerText = `LOC: ${userData.lat.toFixed(4)}, ${userData.lng.toFixed(4)}`;
                        launchCamera();
                    },
                    (err) => {
                        btn.disabled = false;
                        btn.innerHTML = 'إعادة المحاولة';
                        msg.innerText = "❌ تعذر تحديد الموقع. الخدمة مطلوبة.";
                        msg.style.color = "var(--error)";
                    },
                    { enableHighAccuracy: true }
                );
            } else { alert("جهازك لا يدعم GPS"); }
        }

        // 3. تشغيل الكاميرا والمنطق الذكي
        async function launchCamera() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('screenCam').classList.add('active');

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('videoElement').srcObject = stream;
                startBrain();
            } catch(e) { alert("الكاميرا مغلقة!"); location.reload(); }
        }

        function startBrain() {
            const video = document.getElementById('videoElement');
            const laser = document.getElementById('scanLaser');
            const arrow = document.getElementById('arrowLeft');
            const border = document.getElementById('camBorder');
            const text = document.getElementById('camInstruction');
            const title = document.getElementById('camStatus');
            const counter = document.getElementById('camCounter');

            let step = 0; // 0=Detection, 1=Stable, 2=Action
            let frames = 0;
            let timer = null;

            const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 });

            const loop = setInterval(async () => {
                if(video.paused || video.ended) return;

                const det = await faceapi.detectSingleFace(video, opts)
                                          .withFaceLandmarks()
                                          .withFaceDescriptor()
                                          .withFaceExpressions();

                if(det) {
                    const nose = det.landmarks.getNose()[0];
                    const jaw = det.landmarks.getJawOutline();
                    const ratio = Math.abs(nose.x - jaw[0].x) / Math.abs(nose.x - jaw[16].x);
                    
                    const diff = Math.abs(nose.x - lastNoseX);
                    lastNoseX = nose.x;
                    const isStable = diff < 5;

                    // --- المنطق ---

                    // 1. مرحلة الثبات (Scan)
                    if(step === 0) {
                        // وجه أمامي وثابت
                        if(ratio > 0.7 && ratio < 1.3 && isStable) {
                            frames++;
                            border.className = "status-border st-scan";
                            text.innerText = "جاري مسح الملامح...";
                            laser.style.display = "block"; // تشغيل الليزر

                            if(frames > 5) {
                                // وجه مقبول -> بدء العد
                                document.getElementById('sScan').play();
                                frames = 0;
                                step = 1; // الانتقال للعد التنازلي
                                
                                let count = 3;
                                counter.style.display = 'flex';
                                text.innerText = "اثبت مكانك...";
                                
                                timer = setInterval(() => {
                                    counter.innerText = count;
                                    count--;
                                    if(count < 0) {
                                        clearInterval(timer);
                                        counter.style.display = 'none';
                                        userData.vector = Array.from(det.descriptor); // حفظ البصمة
                                        
                                        // الانتقال لمرحلة السهم
                                        step = 2;
                                        laser.style.display = "none";
                                        arrow.style.display = "block"; // ⬅️ إظهار السهم
                                        document.getElementById('sBeep').play();
                                        title.innerText = "اختبار الحيوية";
                                        text.innerText = "انظر تجاه السهم";
                                        text.style.color = "var(--warning)";
                                        border.className = "status-border st-wait";
                                    }
                                }, 800);
                            }
                        } else {
                            frames = 0;
                            border.className = "status-border";
                            text.innerText = "انظر للكاميرا مباشرة";
                            laser.style.display = "none";
                        }
                    }

                    // 2. مرحلة الحركة (Look Left)
                    else if(step === 2) {
                        // إذا التفت لليسار (Ratio < 0.6)
                        if(ratio < 0.6) {
                            clearInterval(loop);
                            arrow.style.display = "none";
                            border.className = "status-border st-ok";
                            title.innerText = "تم التحقق";
                            text.innerText = "جاري رفع البيانات...";
                            text.style.color = "var(--success)";
                            document.getElementById('sSuccess').play();
                            upload();
                        }
                    }

                } else {
                    // لا يوجد وجه
                    border.className = "status-border";
                    text.innerText = "ابحث عن وجه...";
                    laser.style.display = "none";
                }
            }, 200);
        }

        // 4. الإرسال للسيرفر
        function upload() {
            if(stream) stream.getTracks().forEach(t => t.stop());

            const payload = {
                action: "register",
                id: userData.id,
                name: userData.name,
                lat: userData.lat,
                lng: userData.lng,
                vector: JSON.stringify(userData.vector)
            };

            fetch(CONFIG.sheetUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
                
                document.getElementById('resName').innerText = userData.name;
                document.getElementById('resTime').innerText = new Date().toLocaleTimeString('ar-EG');
                
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById('screenSuccess').classList.add('active');
            }).catch(e => alert("Network Error"));
        }
    </script>
</body>
</html>
