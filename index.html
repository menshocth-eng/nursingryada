<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الحضور الصارم</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* نفس التصميم الذي أعجبك (Light Glass) */
        :root { --primary: #0ea5e9; --glass: rgba(255, 255, 255, 0.95); --bg: #0f172a; }
        body { font-family: 'Cairo'; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-image: url('https://a.top4top.io/p_36115ao3o1.jpg'); background-size: cover; overflow: hidden; }
        .app-card { background: var(--glass); width: 90%; max-width: 400px; border-radius: 30px; padding: 30px 20px; text-align: center; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .scan-box { width: 260px; height: 260px; margin: 20px auto; border-radius: 50px; background: #000; overflow: hidden; border: 4px solid #e2e8f0; position: relative; transform: translateZ(0); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .laser-beam { position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to bottom, transparent, #0ea5e9); border-bottom: 3px solid #0ea5e9; animation: scan 2s infinite; display: none; }
        .input-ui { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 15px; margin-bottom: 10px; text-align: center; font-size: 16px; outline: none; }
        .btn-ui { width: 100%; padding: 15px; background: #0ea5e9; color: white; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; }
        .btn-ui:disabled { background: #94a3b8; }
        .section { display: none; } .section.active { display: block; animation: fade 0.5s; }
        @keyframes scan { 0% {top:-50%} 100% {top:100%} } @keyframes fade { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
        
        /* النوافذ */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; }
        .m-content { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 80%; max-width: 320px; }
    </style>
</head>
<body>

    <div id="loader" style="position:fixed; inset:0; background:rgba(255,255,255,0.98); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <i class="fa-solid fa-server fa-spin" style="font-size:40px; color:#0ea5e9; margin-bottom:20px;"></i>
        <h3>جاري تحميل النظام...</h3>
    </div>

    <div id="resultModal" class="modal">
        <div class="m-content">
            <div id="resIcon" style="font-size:50px; margin-bottom:15px;"></div>
            <h2 id="resTitle" style="margin:0;"></h2>
            <p id="resMsg" style="color:#666; font-size:13px;"></p>
            <button onclick="location.reload()" class="btn-ui" style="margin-top:15px;">حسناً</button>
        </div>
    </div>

    <div class="app-card">
        <div id="secInput" class="section active">
            <h2 style="color:#0ea5e9">تسجيل الحضور</h2>
            <p>أدخل بياناتك بدقة</p>
            <input type="text" id="uName" class="input-ui" placeholder="الاسم الثلاثي">
            <input type="number" id="uID" class="input-ui" placeholder="الكود الجامعي">
            <button onclick="checkData()" id="btnStart" class="btn-ui">بدء الكاميرا</button>
            <div id="gpsStat" style="font-size:11px; margin-top:10px; color:#999;">GPS REQUIRED</div>
        </div>

        <div id="secCam" class="section">
            <h3 id="camStatus">جاري الفحص...</h3>
            <div class="scan-box" id="camBox">
                <video id="vid" autoplay muted playsinline></video>
                <div class="laser-beam" id="laser"></div>
            </div>
            <p id="camHint" style="color:#0ea5e9; font-weight:bold;">اثبت مكانك</p>
        </div>
    </div>

    <script>
        const CONFIG = {
            // 🔴🔴 ضع الرابط الجديد هنا 🔴🔴
            apiUrl: "https://script.google.com/macros/s/AKfycbyVwg9zMZq961sx7ifrwZpYwP2ha24rhxDkuLRrDegvQgzy3QBTVZymcVm857IAPDoG/exec",
            models: 'https://justadudewhohacks.github.io/face-api.js/models'
        };

        let user = { id: null, name: null, lat: null, lng: null, vector: null };
        let stream = null;
        let isSubmitting = false; // 🔒 القفل لمنع التكرار

        window.onload = async () => {
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.models),
                    faceapi.nets.faceLandmark68Net.loadFromUri(CONFIG.models),
                    faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.models),
                    faceapi.nets.faceExpressionNet.loadFromUri(CONFIG.models)
                ]);
                document.getElementById('loader').style.display = 'none';
            } catch(e) { alert("فشل تحميل الموديلات"); }
        };

        function checkData() {
            const name = document.getElementById('uName').value;
            const id = document.getElementById('uID').value;
            if(name.length < 3 || id.length < 3) return alert("بيانات ناقصة");
            
            user.name = name; user.id = id;
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStart').innerText = "جاري تحديد الموقع...";

            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    user.lat = pos.coords.latitude;
                    user.lng = pos.coords.longitude;
                    document.getElementById('gpsStat').innerText = "GPS OK";
                    document.getElementById('gpsStat').style.color = "green";
                    startCam();
                }, () => { alert("الموقع مطلوب!"); location.reload(); }, {enableHighAccuracy: true});
            } else { alert("GPS Not Supported"); }
        }

        async function startCam() {
            document.getElementById('secInput').classList.remove('active');
            document.getElementById('secCam').classList.add('active');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('vid').srcObject = stream;
                runAI();
            } catch(e) { alert("الكاميرا مطلوبة"); location.reload(); }
        }

        function runAI() {
            const video = document.getElementById('vid');
            const laser = document.getElementById('laser');
            const hint = document.getElementById('camHint');
            const box = document.getElementById('camBox');
            
            let stableFrames = 0;
            const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 });

            const loop = setInterval(async () => {
                if(isSubmitting) { clearInterval(loop); return; } // إيقاف اللوب عند الإرسال

                const det = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();

                if(det) {
                    stableFrames++;
                    box.style.borderColor = "#0ea5e9";
                    laser.style.display = "block";
                    hint.innerText = "جاري المسح... " + (stableFrames*10) + "%";

                    if(stableFrames > 10) {
                        // تم التقاط الوجه بنجاح
                        clearInterval(loop);
                        user.vector = Array.from(det.descriptor);
                        box.style.borderColor = "#10b981"; // أخضر
                        hint.innerText = "تم الالتقاط! جاري الإرسال...";
                        uploadData();
                    }
                } else {
                    stableFrames = 0;
                    box.style.borderColor = "#e2e8f0";
                    laser.style.display = "none";
                    hint.innerText = "انظر للكاميرا";
                }
            }, 200);
        }

        function uploadData() {
            if(isSubmitting) return; // منع التكرار
            isSubmitting = true; 

            if(stream) stream.getTracks().forEach(t => t.stop());

            const payload = {
                id: user.id,
                name: user.name,
                lat: user.lat,
                lng: user.lng,
                vector: JSON.stringify(user.vector)
            };

            fetch(CONFIG.apiUrl, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                showResult(data);
            })
            .catch(e => {
                // في حالة no-cors قد لا نرى الرد، لكن السيرفر سيسجل
                // سنعرض رسالة عامة
                showResult({status: 'unknown', message: 'تم إرسال الطلب. تحقق من حالتك.'});
            });
        }

        function showResult(data) {
            const modal = document.getElementById('resultModal');
            const icon = document.getElementById('resIcon');
            const title = document.getElementById('resTitle');
            const msg = document.getElementById('resMsg');

            modal.style.display = 'flex';

            if(data.status === 'success') {
                icon.innerHTML = '<i class="fa-solid fa-check-circle" style="color:#10b981;"></i>';
                title.innerText = "تم الحضور";
                title.style.color = "#10b981";
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            } else if (data.status === 'duplicate') {
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i>';
                title.innerText = "محاولة غش!";
                title.style.color = "#ef4444";
                if(navigator.vibrate) navigator.vibrate(500);
            } else {
                icon.innerHTML = '<i class="fa-solid fa-info-circle" style="color:#f59e0b;"></i>';
                title.innerText = "تنبيه";
                title.style.color = "#f59e0b";
            }
            msg.innerText = data.message;
        }
    </script>
</body>
</html>
