<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الحضور الذكي</title>
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: rgba(255,255,255,0.95); color: #1e293b; width: 90%; max-width: 400px; padding: 20px; border-radius: 20px; text-align: center; margin-top: 20px; }
        input { width: 90%; padding: 12px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 10px; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #0ea5e9; color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .cam-box { width: 260px; height: 260px; background: #000; border-radius: 50%; margin: 20px auto; overflow: hidden; border: 5px solid #e2e8f0; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .status-ok { border-color: #10b981; box-shadow: 0 0 20px #10b981; }
        .status-wait { border-color: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 99; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #0ea5e9; }
        
        /* المودال */
        .modal-bg { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:100; }
        .modal { background:white; width:80%; max-width:300px; padding:20px; border-radius:20px; text-align:center; }
    </style>
</head>
<body>

    <div id="loader">
        <h2>جاري تحميل النظام...</h2>
        <p>يرجى الانتظار</p>
    </div>

    <div class="modal-bg" id="modal">
        <div class="modal">
            <h2 id="mTitle"></h2>
            <p id="mMsg" style="color:#666;"></p>
            <button onclick="location.reload()">حسناً</button>
        </div>
    </div>

    <div class="card">
        <h2>تسجيل الحضور</h2>
        <div id="form">
            <input type="text" id="name" placeholder="الاسم الثلاثي">
            <input type="number" id="uid" placeholder="الرقم الجامعي (ID)">
            <button onclick="initSystem()">ابدأ التسجيل 📸</button>
        </div>

        <div id="camArea" style="display:none;">
            <div class="cam-box" id="camBorder">
                <video id="video" autoplay muted playsinline></video>
            </div>
            <h3 id="status" style="color:#0ea5e9">اسمح بالكاميرا والموقع...</h3>
        </div>
    </div>

    <script>
        // 🔴🔴 ضع الرابط الجديد هنا 🔴🔴
        const API_URL = "https://script.google.com/macros/s/AKfycbyjD6AfuTjvGASOYE3MYstEypraGDeJSUFV1P3aXfafOzhiqZFWtDTGu5zjvmIi-on2/exec"; 

        const MODEL_URI = 'https://justadudewhohacks.github.io/face-api.js/models';
        const video = document.getElementById('video');
        let userLat = "", userLng = "";
        let capturedVector = null;

        // تحميل الموديلات
        window.onload = async () => {
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URI),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URI),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URI)
            ]);
            document.getElementById('loader').style.display = 'none';
        };

        async function initSystem() {
            const name = document.getElementById('name').value;
            const id = document.getElementById('uid').value;
            if(!name || !id) return alert("أدخل البيانات!");

            // 1. طلب الموقع
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    startCam();
                }, err => {
                    alert("⚠️ لازم تفتح الـ GPS عشان نسجلك!");
                    startCam(); // هنكمل برضه بس هيطلع في الشيت من غير موقع
                }, {enableHighAccuracy: true});
            } else {
                alert("موبايلك لا يدعم GPS");
                startCam();
            }
        }

        async function startCam() {
            document.getElementById('form').style.display = 'none';
            document.getElementById('camArea').style.display = 'block';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                document.getElementById('status').innerText = "👀 انظر للكاميرا بثبات";
                detectFace();
            } catch(e) { alert("الكاميرا محظورة!"); location.reload(); }
        }

        function detectFace() {
            let step = 1; // 1=Front, 2=Left
            const loop = setInterval(async () => {
                const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                
                if(det) {
                    const nose = det.landmarks.getNose()[0];
                    const jaw = det.landmarks.getJawOutline();
                    const left = Math.abs(nose.x - jaw[0].x);
                    const right = Math.abs(nose.x - jaw[16].x);
                    const ratio = left / right;

                    if(step === 1 && ratio > 0.7 && ratio < 1.3) {
                        capturedVector = Array.from(det.descriptor);
                        step = 2;
                        document.getElementById('camBorder').className = "cam-box status-wait";
                        document.getElementById('status').innerText = "⬅️ التفت لليسار";
                        document.getElementById('status').style.color = "#f59e0b";
                    } else if(step === 2 && ratio < 0.5) {
                        clearInterval(loop);
                        document.getElementById('camBorder').className = "cam-box status-ok";
                        document.getElementById('status').innerText = "✅ جاري الإرسال...";
                        sendData();
                    }
                }
            }, 200);
        }

        function sendData() {
            const payload = {
                id: document.getElementById('uid').value,
                name: document.getElementById('name').value,
                vector: capturedVector,
                lat: userLat,
                lng: userLng
            };

            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(r => r.json())
            .then(data => {
                const modal = document.getElementById('modal');
                const title = document.getElementById('mTitle');
                modal.style.display = 'flex';
                
                if(data.status === 'success') {
                    title.innerText = "✅ تم بنجاح";
                    title.style.color = "green";
                } else {
                    title.innerText = "❌ خطأ";
                    title.style.color = "red";
                }
                document.getElementById('mMsg').innerText = data.message;
            })
            .catch(e => alert("حدث خطأ في الاتصال"));
        }
    </script>
</body>
</html>
