<!DOCTYPE html>
<html>
<body>
    <h2>اختبار الاتصال بالسيرفر</h2>
    <button onclick="testServer()">اضغط هنا للاختبار</button>
    <p id="result">النتيجة ستظهر هنا...</p>

    <script>
        // 🔴 ضع رابط الاسكريبت الخاص بك هنا
        var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx36V1RMbbK_dPfFPJ_K63mmdqqZNoTD2oF3JIrwPealPnjv1p1EoOv9JZFgBGpTrLr/exec"; 

        function testServer() {
            document.getElementById("result").innerText = "جاري الاتصال...";
            
            // بيانات وهمية للتجربة
            var payload = {
                id: "123",
                name: "Test User",
                vector: [0.1, 0.2, 0.3] // بصمة وهمية
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById("result").innerText = "✅ نجح! الرد: " + data.message;
                document.getElementById("result").style.color = "green";
            })
            .catch(err => {
                document.getElementById("result").innerText = "❌ فشل: " + err;
                document.getElementById("result").style.color = "red";
                console.error("خطأ تفصيلي:", err);
            });
        }
    </script>
</body>
</html>
