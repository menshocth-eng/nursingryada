<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل البصمة (وضع التصحيح)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        body { background: #0f172a; color: white; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .main-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.2); }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: none; text-align: center; }
        button { width: 100%; padding: 15px; background: #0ea5e9; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; margin-top: 10px; }
        #debugLog { background: #000; color: #0f0; font-family: monospace; padding: 10px; margin-top: 20px; width: 90%; height: 150px; overflow-y: scroll; border: 1px solid #333; text-align: left; direction: ltr; font-size: 12px; }
        video { width: 100%; border-radius: 15px; transform: scaleX(-1); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>تسجيل الوجه (Debug Mode)</h2>
        
        <div id="formArea">
            <input type="text" id="studentName" placeholder="الاسم">
            <input type="number" id="studentID" placeholder="الكود الجامعي">
            <button id="btnStart" onclick="startDebugProcess()">ابدأ الكاميرا 📸</button>
        </div>

        <div id="camArea" style="display:none;">
            <video id="video" autoplay muted playsinline></video>
            <div id="statusText">جاري التحميل...</div>
        </div>
    </div>

    <div id="debugLog">Sytem Log initialized...</div>

    <script>
        // دالة لكتابة الأخطاء على الشاشة
        function log(msg) {
            const logDiv = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
            console.log(msg); // يكتب في الكونسول أيضاً
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // التقاط أي خطأ عام في الصفحة
        window.onerror = function(message, source, lineno, colno, error) {
            log("❌ GLOBAL ERROR: " + message);
        };

        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx36V1RMbbK_dPfFPJ_K63mmdqqZNoTD2oF3JIrwPealPnjv1p1EoOv9JZFgBGpTrLr/exec";

        // 1. التأكد من تحميل المكتبة
        window.onload = async function() {
            log("Checking face-api library...");
            if (typeof faceapi === 'undefined') {
                log("❌ CRITICAL: face-api.js failed to load! Check Internet.");
                alert("فشل تحميل ملفات النظام! تأكد من الإنترنت.");
                return;
            }
            log("✅ face-api.js is loaded.");
            
            try {
                log("Loading AI Models...");
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                log("✅ AI Models Loaded Successfully!");
            } catch (e) {
                log("❌ Error loading models: " + e.message);
            }
        };

        // 2. عند ضغط الزر
        async function startDebugProcess() {
            log("Button Clicked!"); // إذا ظهرت هذه، فالزر يعمل
            
            const name = document.getElementById('studentName').value;
            const id = document.getElementById('studentID').value;

            if(!name || !id) {
                alert("أدخل البيانات أولاً");
                log("⚠️ Validation failed: Empty fields");
                return;
            }

            document.getElementById('formArea').style.display = 'none';
            document.getElementById('camArea').style.display = 'block';

            log("Requesting Camera...");

            // تشغيل الكاميرا
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                const video = document.getElementById('video');
                video.srcObject = stream;
                log("✅ Camera started stream");
                
                video.onloadedmetadata = () => {
                    log("🎥 Video ready. Starting detection loop...");
                    startLoop();
                };
            })
            .catch(err => {
                log("❌ Camera Error: " + err.name + " - " + err.message);
                alert("خطأ في الكاميرا: " + err.name);
            });
        }

        async function startLoop() {
            const video = document.getElementById('video');
            
            setInterval(async () => {
                if(video.paused || video.ended) return;

                try {
                    const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                    
                    if(detections) {
                        document.getElementById('statusText').innerText = "✅ وجه مكتشف! (أرقام: " + detections.descriptor[0].toFixed(2) + "...)";
                        document.getElementById('statusText').style.color = "#0f0";
                        
                        // تجربة إرسال سريعة (للاختبار)
                        // sendData(detections.descriptor);
                    } else {
                        document.getElementById('statusText').innerText = "جاري البحث عن وجه...";
                        document.getElementById('statusText').style.color = "white";
                    }
                } catch(e) {
                    log("Detection Error: " + e.message);
                }
            }, 500);
        }
    </script>
</body>
</html>
