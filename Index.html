<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل البصمة البيومترية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        :root { --primary: #0ea5e9; --primary-dark: #0284c7; --text-main: #1e293b; --bg-glass: rgba(255, 255, 255, 0.95); }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #0f172a;
            background-image: url('https://a.top4top.io/p_36115ao3o1.jpg');
            background-size: cover; background-position: center; background-blend-mode: overlay;
        }

        .main-card {
            background: var(--bg-glass); width: 90%; max-width: 400px;
            border-radius: 30px; padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center;
            position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
        }

        h1 { color: var(--text-main); font-weight: 900; margin-bottom: 5px; font-size: 22px; }
        p { color: #64748b; font-size: 13px; margin-bottom: 25px; font-weight: 600; }

        .camera-wrapper {
            width: 260px; height: 260px; margin: 0 auto 20px auto;
            border-radius: 50%; border: 6px solid #e2e8f0;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease; background: #000;
        }
        
        .status-idle { border-color: #e2e8f0; }
        .status-wait { border-color: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
        .status-success { border-color: #10b981; box-shadow: 0 0 20px #10b981; }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .input-group { margin-bottom: 15px; }
        .modern-input {
            width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 15px;
            font-size: 16px; font-weight: 700; background: #f8fafc; outline: none; text-align: center;
            transition: 0.3s;
        }
        .modern-input:focus { border-color: var(--primary); background: white; }

        .btn-action {
            width: 100%; padding: 15px; border: none; border-radius: 20px;
            font-size: 18px; font-weight: 800; color: white; cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4); transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }

        .status-msg { font-size: 18px; font-weight: 800; margin-bottom: 20px; min-height: 30px; color: var(--primary-dark); }
        
        .loader-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* === تنسيق النافذة المنبثقة (Modal) === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s;
        }

        .modal-box {
            background: white; width: 85%; max-width: 320px;
            padding: 30px 20px; border-radius: 25px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transform: scale(0.8); animation: popUp 0.3s forwards;
        }

        .modal-icon {
            font-size: 50px; margin-bottom: 15px;
        }

        .modal-title { font-size: 20px; font-weight: 900; margin-bottom: 10px; color: #1e293b; }
        .modal-desc { font-size: 14px; color: #64748b; margin-bottom: 20px; font-weight: 600; }
        
        .modal-btn {
            width: 100%; padding: 12px; border-radius: 15px; border: none;
            font-weight: 800; cursor: pointer; font-size: 16px;
        }

        .success-theme .modal-icon { color: #10b981; }
        .success-theme .modal-btn { background: #10b981; color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        .error-theme .modal-icon { color: #ef4444; }
        .error-theme .modal-btn { background: #ef4444; color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popUp { to { transform: scale(1); } }

    </style>
</head>
<body>

    <div id="resultModal" class="modal-overlay">
        <div class="modal-box" id="modalBox">
            <div class="modal-icon" id="modalIcon"></div>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-desc" id="modalDesc"></div>
            <button class="modal-btn" onclick="closeModal()">موافق</button>
        </div>
    </div>

    <div class="main-card">
        <div id="loadingScreen" class="loader-overlay">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 50px; color: var(--primary); margin-bottom: 20px;"></i>
            <h3>جاري تحميل النظام الذكي...</h3>
        </div>

        <div id="registrationUI">
            <div style="margin-bottom: 20px;">
                <i class="fa-solid fa-face-viewfinder" style="font-size: 40px; color: var(--primary);"></i>
            </div>
            <h1>تسجيل بصمة الوجه</h1>
            <p>أدخل بياناتك ثم اتبع تعليمات الكاميرا</p>

            <div id="inputFields">
                <div class="input-group">
                    <input type="text" id="studentName" class="modern-input" placeholder="اسم الطالب (ثلاثي)">
                </div>
                <div class="input-group">
                    <input type="number" id="studentID" class="modern-input" placeholder="الكود الجامعي (ID)">
                </div>
                <button id="startBtn" class="btn-action" onclick="startProcess()">
                    ابدأ الكاميرا <i class="fa-solid fa-camera"></i>
                </button>
            </div>

            <div id="cameraInterface" style="display: none;">
                <div class="camera-wrapper status-idle" id="camWrapper">
                    <video id="video" autoplay muted playsinline></video>
                </div>
                <div id="instructionText" class="status-msg">جاري التشغيل...</div>
                <button onclick="location.reload()" class="btn-action" style="background: #ef4444; font-size: 14px; padding: 10px;">إلغاء</button>
            </div>
        </div>
    </div>

    <audio id="successSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

    <script>
        // رابط الاسكريبت الخاص بك
        var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpO4Gyn0DgF-zCW0rd38be5uCrF_xrKXIKXA_lKM9BhhBF7ImJkGwMuuofCj817gvK/exec"; 

        const video = document.getElementById('video');
        const instructionText = document.getElementById('instructionText');
        const camWrapper = document.getElementById('camWrapper');
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        
        let capturedDescriptor = null;
        let checkStep = 0; 
        let isProcessing = false;

        window.addEventListener('load', async () => {
            try {
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                document.getElementById('loadingScreen').style.display = 'none';
            } catch (e) {
                alert("فشل تحميل ملفات الذكاء الاصطناعي.");
            }
        });

        async function startProcess() {
            const name = document.getElementById('studentName').value;
            const id = document.getElementById('studentID').value;
            if (!name || !id) { alert("يرجى إدخال البيانات"); return; }
            document.getElementById('inputFields').style.display = 'none';
            document.getElementById('cameraInterface').style.display = 'block';

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    video.srcObject = stream;
                    instructionText.innerText = "جاري البحث عن وجهك...";
                    startDetectionLoop();
                })
                .catch(err => { alert("الكاميرا محظورة!"); location.reload(); });
        }

        async function startDetectionLoop() {
            checkStep = 1; 
            const interval = setInterval(async () => {
                if (isProcessing) return;
                const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
                const detections = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();

                if (detections) {
                    const landmarks = detections.landmarks;
                    const nose = landmarks.getNose()[0];
                    const leftJaw = landmarks.getJawOutline()[0];
                    const rightJaw = landmarks.getJawOutline()[16];
                    
                    const distLeft = Math.abs(nose.x - leftJaw.x);
                    const distRight = Math.abs(nose.x - rightJaw.x);
                    const ratio = distLeft / distRight;

                    if (checkStep === 1) {
                        if (ratio > 0.7 && ratio < 1.3) {
                            capturedDescriptor = Array.from(detections.descriptor);
                            checkStep = 2; 
                            camWrapper.className = "camera-wrapper status-wait";
                            instructionText.innerHTML = '<span style="color:#f59e0b">⬅️ الآن التفت لليسار</span>';
                            if(navigator.vibrate) navigator.vibrate(50);
                        }
                    } else if (checkStep === 2) {
                        if (ratio < 0.5) {
                            clearInterval(interval);
                            isProcessing = true;
                            camWrapper.className = "camera-wrapper status-success";
                            instructionText.innerHTML = '<span style="color:#10b981">✅ جاري التحقق...</span>';
                            document.getElementById('successSound').play();
                            sendDataToSheet();
                        }
                    }
                }
            }, 200);
        }

        function showResultModal(type, title, message) {
            const modal = document.getElementById('resultModal');
            const box = document.getElementById('modalBox');
            const icon = document.getElementById('modalIcon');
            const titleEl = document.getElementById('modalTitle');
            const descEl = document.getElementById('modalDesc');

            modal.style.display = 'flex';
            
            if (type === 'success') {
                box.className = 'modal-box success-theme';
                icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else {
                box.className = 'modal-box error-theme';
                icon.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
            }

            titleEl.innerText = title;
            descEl.innerText = message;
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
            location.reload(); // إعادة تحميل الصفحة لاستقبال طالب جديد
        }

        function sendDataToSheet() {
            const name = document.getElementById('studentName').value;
            const id = document.getElementById('studentID').value;
            const payload = { id: id, name: name, vector: capturedDescriptor };

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    // ✅ تم التعرف بنجاح (تسجيل جديد)
                    showResultModal('success', 'تم التعرف عليك', `تم تسجيل ${name} بنجاح`);
                } else {
                    // ❌ الطالب مسجل من قبل
                    showResultModal('error', 'فشل التعرف عليك', 'لقد قمت بالتسجيل مسبقاً لهذا اليوم');
                }
            })
            .catch(err => {
                showResultModal('error', 'خطأ', 'حدث خطأ في الاتصال بالسيرفر');
            });
        }
    </script>
</body>
</html>
